<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Served from a sub-folder (mismatched.gg/graphics): without a trailing slash, the relative file
      // paths below would point at the site root and 404, so add the slash first.
      if (!location.pathname.endsWith('/') && !/\.[a-z0-9]+$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash)
    </script>
    <link rel="icon" type="image/svg+xml" href="./brand/mismatched-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link previews (X, Discord, iMessage): absolute URLs; the image is public/og-image.jpg (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mismatched.gg/graphics/" />
    <meta property="og:image" content="https://mismatched.gg/graphics/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Mismatched · Standings Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
